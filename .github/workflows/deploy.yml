name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同仓 main 部署串行：后到者排队而非并发写同一目录（防止旧构建后完成回滚线上）
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install + build web bundle
        run: |
          npm ci
          npm run typecheck
          npm test -w @v2media/server
          npm run build -w @v2media/web

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 固定的主机公钥（非 TOFU keyscan，防中间人伪装服务器）
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .git --exclude 'apps/extension/dist' \
            --exclude 'apps/server/data' --exclude '*.env' --exclude '.*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$SSH_USER@$SSH_HOST:apps/v2-media/"
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Install deps + restart service
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            'cd ~/apps/v2-media && npm install --no-audit --no-fund && sudo -n systemctl restart v2-media && sleep 2 && curl -sf http://127.0.0.1:3000/health'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
