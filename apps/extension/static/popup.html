<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><style>
body{width:280px;font-family:system-ui;padding:16px}
h3{margin:0 0 8px}
#status{color:#78716c;font-size:13px;margin-bottom:4px}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #eee}
.row .label{font-size:13px;color:#27272a}
.row .hint{font-size:11px;color:#a1a1aa;margin-top:2px}
.switch{position:relative;width:36px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#d4d4d8;border-radius:999px;cursor:pointer;transition:.15s}
.slider:before{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked + .slider{background:#e2442f}
.switch input:checked + .slider:before{transform:translateX(16px)}
.switch input:disabled + .slider{opacity:.5;cursor:default}
button#open{margin-top:12px;width:100%;padding:8px;border:0;border-radius:8px;background:#e2442f;color:#fff;cursor:pointer}
#collection{max-width:130px;padding:4px 6px;border:1px solid #e4e4e7;border-radius:6px;font-size:12px;background:#fff}
#newCol{padding:5px 8px;border:1px solid #e4e4e7;border-radius:6px;font-size:12px}
#newCol::placeholder{color:#a1a1aa}
#newColBtn{padding:5px 10px;border:0;border-radius:6px;background:#e2442f;color:#fff;font-size:12px;cursor:pointer;flex:none}
</style></head>
<body>
  <h3>v2-media 助手</h3>
  <div id="status">检测中…</div>
  <div class="row">
    <div>
      <div class="label">启用插件</div>
      <div class="hint">关闭后暂停采集、心跳和发布任务</div>
    </div>
    <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
  </div>
  <div class="row">
    <div>
      <div class="label">浏览时自动采集</div>
      <div class="hint">关闭后只用卡片按钮手动采集</div>
    </div>
    <label class="switch"><input type="checkbox" id="autoCollect"><span class="slider"></span></label>
  </div>
  <div class="row">
    <div>
      <div class="label">深度采集（含评论）</div>
      <div class="hint">手动点「采集本篇」始终补评论；此开关控制浏览自动采集和「一键全部入库」也补评论（开隐藏页，较慢更易触风控）</div>
    </div>
    <label class="switch"><input type="checkbox" id="deepCollect"><span class="slider"></span></label>
  </div>
  <div class="row">
    <div><div class="label">只自动采集热门笔记</div><div class="hint">按点赞数筛选，手动采集不受限制</div></div>
    <label class="switch"><input type="checkbox" id="hotEnabled" aria-label="只自动采集热门笔记"><span class="slider"></span></label>
  </div>
  <div id="hotOptions" style="padding:8px 0 12px">
    <label for="minLikes" style="font-size:13px">最低点赞数</label>
    <input id="minLikes" type="number" min="0" step="1" required style="width:90px;margin-left:8px;padding:5px;border:1px solid #e4e4e7;border-radius:6px">
    <div style="display:flex;gap:8px;margin-top:8px">
      <button type="button" data-hot-preset="500">500</button><button type="button" data-hot-preset="1000">1000</button><button type="button" data-hot-preset="3000">3000</button>
    </div>
    <div class="hint" style="font-size:11px;color:#78716c;margin-top:6px">点赞数达到门槛才自动入库；开启深度采集后继续补评论。</div>
    <div id="hotStatus" role="status" style="font-size:12px;margin-top:6px;color:#78716c"></div>
  </div>
  <div class="row" id="colRow">
    <div>
      <div class="label">当前采集库</div>
      <div class="hint">采集的笔记归入所选库，便于按主题分析</div>
    </div>
    <select id="collection"></select>
  </div>
  <div class="row" id="newColRow" style="display:none">
    <input id="newCol" placeholder="新库名，如 健身" maxlength="32" style="flex:1">
    <button id="newColBtn">新建</button>
  </div>
  <button id="open">打开工作台</button>
  <script src="popup.js"></script>
</body>
</html>
